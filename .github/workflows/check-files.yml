name: Check Unit 1 Submission

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const EXPECTED_BRANCH = 'unit-1-work';
            const FILE = 'SUBMISSION.md';
            const PLACEHOLDER = '_Your answer here._';
            const SECTIONS = [
              'Assignment 1: Course Setup & Software Installation',
              'Assignment 2: GitHub Essentials',
              'Assignment 3: Git Concepts',
              'Assignment 4: Open Source Discovery'
            ];

            const pr = context.payload.pull_request;
            const notes = [];
            if (pr.head.ref !== EXPECTED_BRANCH) {
              notes.push(`⚠️ This Pull Request comes from branch \`${pr.head.ref}\`. Unit 1 work should be on \`${EXPECTED_BRANCH}\`.`);
            }

            let text = null;
            try {
              const resp = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: FILE,
                ref: pr.head.sha
              });
              text = Buffer.from(resp.data.content, 'base64').toString('utf8');
            } catch (e) {
              text = null;
            }

            let rows = '';
            let allDone = true;
            if (text === null) {
              allDone = false;
              rows = `| ❌ | \`${FILE}\` is missing from the repository root |\n`;
            } else {
              const parts = text.split(/^## /m);
              for (const title of SECTIONS) {
                const body = parts.find(p => p.startsWith(title));
                if (!body) {
                  allDone = false;
                  rows += `| ❌ | ${title}: section heading not found |\n`;
                  continue;
                }
                const left = body.split(PLACEHOLDER).length - 1;
                if (left > 0) allDone = false;
                rows += left === 0
                  ? `| ✅ | ${title} |\n`
                  : `| ❌ | ${title}: ${left} placeholder${left === 1 ? '' : 's'} still unanswered |\n`;
              }
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('Unit 1 Submission Check')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
            }

            const status = allDone
              ? '✅ All four assignment sections are filled in.'
              : '❌ Some sections are incomplete. Sections you have not reached yet will show ❌ until you finish them.';
            const body = [
              '## Unit 1 Submission Check',
              '',
              ...notes,
              notes.length ? '' : null,
              status,
              '',
              '| Status | Section |',
              '|--------|---------|',
              rows,
              '_Push another commit to re-run this check._'
            ].filter(l => l !== null).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
